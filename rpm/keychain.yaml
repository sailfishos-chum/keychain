Name: keychain
Summary: SSH and GPG agent manager for secure key management
Version: 2.9.8
Release: 2
License: GPLv2
URL: https://kernel-seeds.org/projects/keychain/
SCM: https://github.com/danielrobbins/keychain
Sources:
    - '%{name}-%{version}.tar.gz'
    - 'https://raw.githubusercontent.com/gentoo/gentoo/master/net-misc/keychain/files/keychain-2.8.5-empty-ssh-askpass.patch'
    - 'https://raw.githubusercontent.com/gentoo/gentoo/master/net-misc/keychain/files/keychain-2.8.5-malformed-ssh-key.patch'
    - 'https://raw.githubusercontent.com/gentoo/gentoo/master/net-misc/keychain/files/keychain-2.8.5-typos.patch'
Patches:
    - 'keychain-%{version}-empty-ssh-askpass.patch'
    - 'keychain-%{version}-typos.patch'
Description: |
    Keychain is a manager for OpenSSH and GnuPG agents. It acts as a front-end
    to ssh-agent and gpg-agent, allowing you to easily have one long-running
    agent process per system, rather than per login session. This dramatically
    reduces the number of times you need to enter your passphrase from once per
    new login session to once every time your local machine is rebooted.

    %if 0%{?_chum}
    Type: console-application
    PackagedBy: nephros
    DeveloperName:  Daniel Robbins
    Categories:
     - Security
     - ConsoleOnly
     - Utility
    Custom:
      Repo: https://github.com/danielrobbins/keychain
      PackagingRepo: https://github.com/sailfishos-chum/keychain
    Links:
      Homepage: https://kernel-seeds.org/projects/keychain/
    %endif

SetupOptions: -q -n %{name}-%{version}/upstream
# previously published on Openrepos:
Provides:
  - 'openrepos-keychain = %{version}'
Conflicts:
  - 'openrepos-keychain <= %{version}'
Obsoletes:
  - 'openrepos-keychain < %{version}'
#Requires:
#PkgConfigBR:
PkgBR:
  - 'perl'
Configure: none
Builder: none
BuildArch: noarch
Files:
 - '%{_bindir}/*'
